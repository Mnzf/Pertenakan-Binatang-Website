<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Registration | Kaznisah Farming Sdn Bhd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700&family=Jacques+Francois&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="">

  <main class="auth-page">
    <aside class="auth-aside">
      <a class="auth-logo" href="../index.html">KAZNISAH FARMING</a>
      <div>
        <p class="eyebrow">BUYER ACCOUNT</p>
        <h1>Create your buyer account</h1>
        <p>[Keep track of animals, inquiries, and messages from the owner.]</p>
      </div>
    </aside>

    <section class="auth-form">
      <h2>Create account</h2>
      <form id="buyer-register-form">
      <label for="reg-full-name">Full name</label>
      <input type="text" id="reg-full-name" required autocomplete="name" name="full-name">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" required autocomplete="email" name="email">
      <label for="reg-phone">Phone</label>
      <input type="tel" id="reg-phone" autocomplete="tel" name="phone">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" required autocomplete="new-password" minlength="8" name="password">
      <p id="buyer-register-form-error" role="alert"></p>
      <button type="submit" class="btn full">Create Buyer Account</button>
      </form>
      <p>Already have an account? <a href="buyer-login.html">Sign in</a></p>
      <p><a href="../index.html">Back to website</a></p>
    </section>
  </main>

  <!-- JavaScript -->
   <script type="module" src="../js/main.js"></script>
   <script type="module" src="../js/pages/auth-forms.js"></script>
</body>
</html>
