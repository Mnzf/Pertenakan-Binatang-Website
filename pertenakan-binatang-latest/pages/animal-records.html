<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Records | Kaznisah Farming Sdn Bhd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700&family=Jacques+Francois&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="">

  <div class="portal staff-portal">
    <aside class="portal-side">
      <strong>[ HERD MGMT ]</strong>
      <div class="user-chip"><span>[Account Name]</span><small>Manager</small></div>
      <nav aria-label="Portal navigation">
      <ul>
        <li><a href="staff-dashboard.html">Overview</a></li>
        <li><a href="animal-records.html" aria-current="page">Animal Records</a></li>
        <li><a href="staff-inquiries.html">Sales + Inquiries</a></li>
      </ul>
      </nav>
      <a class="btn secondary" href="staff-login.html" id="logout-btn">Sign out</a>
    </aside>
    <div class="portal-main">
      <div class="portal-top">
        <span>Operational workspace</span>
      </div>
      <div class="dashboard-heading">
        <div><p class="eyebrow">HERD MANAGEMENT</p><h1>Animal records</h1><p id="records-count">Loading...</p></div>
        <div><a class="btn" href="animal-form.html">+ Add Animal</a></div>
      </div>
      <section class="panel record-panel">
        <form class="record-tools" id="record-filters">
          <label for="r-search">Search</label>
          <input type="search" id="r-search" placeholder="ID, name, breed...">
          <label for="r-species">Species</label><select id="r-species"><option value="">All</option></select>
          <label for="r-breed">Breed</label><select id="r-breed"><option value="">All</option></select>
          <label for="r-status">Status</label><select id="r-status"><option value="">All</option></select>
          <label for="r-location">Location</label><select id="r-location"><option value="">All</option></select>
          <button type="reset" class="text-link">Clear</button>
        </form>
        <div class="table-wrap" id="records-table"><p class="loading">Loading records...</p></div>
        <nav class="pagination" id="records-pagination" aria-label="Pagination"></nav>
      </section>
    </div>
  </div>

  <!-- JavaScript -->
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/pages/animal-records.js"></script>
</body>
</html>
