<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Login | Kaznisah Farming Sdn Bhd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700&family=Jacques+Francois&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="">

  <main class="auth-page">
    <aside class="auth-aside">
      <a class="auth-logo" href="../index.html">KAZNISAH FARMING</a>
      <div>
        <p class="eyebrow">BUYER ACCOUNT</p>
        <h1>Welcome back</h1>
        <p>[Keep track of animals, inquiries, and messages from the owner.]</p>
      </div>
      <img src="../assets/images/placeholder.svg" alt="[Supporting image]">
    </aside>

    <section class="auth-form">
      <h2>Sign in</h2>
      <form id="buyer-login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password">
      <label><input type="checkbox" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
      <p id="buyer-login-form-error" role="alert"></p>
      <button type="submit" class="btn full">Sign In</button>
      </form>
      <p>New buyer? <a href="buyer-register.html">Create buyer account</a></p>
      
      <p><a href="../index.html">Back to website</a></p>
    </section>
  </main>

  <!-- JavaScript -->
</body>
</html>
