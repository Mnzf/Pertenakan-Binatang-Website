<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herd Management Login | Kaznisah Farming Sdn Bhd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Inter:wght@400;600;700&family=Jacques+Francois&family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="">

  <main class="auth-page staff-auth">
    <aside class="auth-aside">
      <a class="auth-logo" href="../index.html">[ HERD MANAGEMENT ]</a>
      <div>
        <p class="eyebrow">STAFF / OWNER ONLY</p>
        <h1>Manage the herd with confidence</h1>
        <p>[Private operational access for ranch owners and staff.]</p>
      </div>
      <img src="../assets/images/placeholder.svg" alt="[Supporting image]">
    </aside>

    <section class="auth-form">
      <h2>Sign in</h2>
      <form id="staff-login-form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password">
      <label><input type="checkbox" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
      <label for="login-2fa">Two-factor code</label>
      <input type="text" id="login-2fa" name="code" placeholder="000 000" inputmode="numeric">
      <div class="role-note"><strong>Role-based access</strong><p>Your account permissions are assigned as Owner, Manager, or Staff.</p></div>
      <p id="staff-login-form-error" role="alert"></p>
      <button type="submit" class="btn full">Secure Sign In</button>
      </form>
      
      
      <p><a href="../index.html">Back to website</a></p>
    </section>
  </main>

  <!-- JavaScript -->
</body>
</html>
