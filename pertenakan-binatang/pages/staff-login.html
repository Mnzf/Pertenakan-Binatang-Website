<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Herd Management Login | Kaznisah Farming SDN BHD</title>
        <link rel="stylesheet" href="/pertenakan-binatang/css/global.css">
        <link rel="stylesheet" href="/pertenakan-binatang/css/components.css">
    </head>
    <body class=">

        <main class="auth-page staff-auth">
            <aside class="auth-aside">
                <a class="auth-logo" href="/pertenakan-binatang/index.html">[ Herd Management ]</a>
                <div>
                    <p class="eyebrow">STAFF / OWNER ONLY</p>
                    <h1>Manage the Herd</h1>
                    <p>[Private operational access for ranch owners and staff.]</p>
                </div>
                <img src="/pertenakan-binatang/assets/images/placeholder.svg" alt="[Supporting image]">
            </aside>

            <section class="auth-form">
                <h2>Sign in</h2>
                <form id="staff-login-form">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password">
                    <label><input type="checkbox" name="remember"> Rememeber me</label>
                    <a href="#">Forget password?</a>
                    <label for="login-2fa">Two-factor code</label>
                    <input type="text" id="login-2fa" name="code" placeholder="000 000" inputmode="numeric">
                    <div class="role-note"><strong>Role-based access</strong><p>Your account permission are assigned as Owner, Manager, or Staff.</p></div>
                    <p id="staff-login-form-error" role="alert"></p>
                    <button type="submit" class="btn full">Secure Sign In</button>
                </form>

                <p><a href="/pertenakan-binatang/index.html">Back to website</a></p>
            </section>
        </main>

        <!-- JavaScript Here -->
        </body>
</html>
